workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build the iOS application
        script: |
          xcodebuild build -project ClimaApp.xcodeproj -scheme ClimaApp -destination "generic/platform=iOS Simulator"
    artifacts:
      - build/ios/ipa/*.ipa
