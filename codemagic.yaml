workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build the iOS application
        script: |
          # Si usas un workspace de Xcode (.xcworkspace):
          xcodebuild build -workspace TuProyecto.xcworkspace -scheme TuEsquema -destination "generic/platform=iOS Simulator"
          
          # O si usas un proyecto simple de Xcode (.xcodeproj):
          # xcodebuild build -project TuProyecto.xcodeproj -scheme TuEsquema -destination "generic/platform=iOS Simulator"
    artifacts:
      - build/ios/ipa/*.ipa
